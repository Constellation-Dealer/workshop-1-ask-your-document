name: checks

# Two checks, both about failures that do not announce themselves.
#
# contrast — text that is slightly too faint is never reported as a bug; people
#   just lose track of what the agent loop is doing, which is the one thing the
#   page exists to show. Derives the colours it checks FROM the stylesheet, so a
#   rule written later is covered too.
#
# feedback — the thumb under the answer is how a rating reaches the platform's
#   review queue. If it silently stops posting, the page looks completely fine
#   and the queue just goes quiet. Driven in a real headless Chrome over CDP,
#   because the bug this guards against lives in DOM wiring, not in a function.
#
# ingestion — the poll loop waits for TargetUMH to finish indexing. UMH also
#   answers Skipped (a PDF with no text layer -- a scan), which a loop written
#   as "break on Completed, throw on Failed" matches neither way, so it spins
#   forever with nothing on screen. Asserts the loop SETTLES rather than
#   checking for particular strings, so the skeleton and the solution are both
#   covered by the same check with nothing skipped.
#
# scope — every participant signs in as the same dealer, so an upload says whose
#   it is only through its entity tag. UMH rejects entityType without entityId
#   with a 400, which for a participant is a dead exercise rather than a
#   warning, so the tag is asserted as "both fields or neither". The scope card
#   is checked too: it is the only place the agent's real tool arguments are
#   visible, and if it stops rendering the exercise still runs with its one
#   observable quietly gone.
#
# None of these installs anything: ubuntu-latest ships python3, node and Chrome, and
# the static server is python3's own. No npm package is fetched at check time.

on:
  push:
    branches: [main, solution]
  pull_request:
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check-contrast.py styles.css

  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve the app
        # python3's own static server, not `npx --yes http-server`: that fetched and
        # executed the latest unpinned npm package on every run, which is a
        # supply-chain execution path this repo does not need -- the app is static
        # files and the runner already has python3.
        run: |
          python3 -m http.server 5199 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5199/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5199/ || { echo "server never came up"; cat /tmp/http.log; exit 1; }
      - name: Start headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          [ -n "$CHROME" ] || { echo "no Chrome on this runner"; exit 1; }
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9333 --user-data-dir=/tmp/cdp about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:9333/json/version && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9333/json/version || { echo "Chrome never exposed CDP"; cat /tmp/chrome.log; exit 1; }
      - name: Drive the feedback flow
        env:
          APP_URL: http://127.0.0.1:5199/
        run: node .github/scripts/test-feedback.mjs

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve the app
        # python3's own static server, not `npx --yes http-server`: that fetched and
        # executed the latest unpinned npm package on every run, which is a
        # supply-chain execution path this repo does not need -- the app is static
        # files and the runner already has python3.
        run: |
          python3 -m http.server 5198 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5198/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5198/ || { echo "server never came up"; cat /tmp/http.log; exit 1; }
      - name: Start headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          [ -n "$CHROME" ] || { echo "no Chrome on this runner"; exit 1; }
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9334 --user-data-dir=/tmp/cdp-ingestion about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:9334/json/version && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9334/json/version || { echo "Chrome never exposed CDP"; cat /tmp/chrome.log; exit 1; }
      - name: Drive the ingestion poll
        env:
          APP_URL: http://127.0.0.1:5198/
          CDP_URL: http://127.0.0.1:9334
        run: node .github/scripts/test-ingestion.mjs

  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve the app
        run: |
          python3 -m http.server 5197 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5197/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5197/ || { echo "server never came up"; cat /tmp/http.log; exit 1; }
      - name: Start headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          [ -n "$CHROME" ] || { echo "no Chrome on this runner"; exit 1; }
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9335 --user-data-dir=/tmp/cdp-scope about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:9335/json/version && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9335/json/version || { echo "Chrome never exposed CDP"; cat /tmp/chrome.log; exit 1; }
      - name: Check the participant entity scope
        env:
          APP_URL: http://127.0.0.1:5197/
          CDP_URL: http://127.0.0.1:9335
        run: node .github/scripts/scope-checks.mjs
