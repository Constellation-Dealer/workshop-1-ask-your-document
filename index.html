<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Your Document — RAG with Agentic Loop</title>
  <style>
    :root {
      --primary: #1a1a2e;
      --primary-light: #16213e;
      --accent: #e94560;
      --accent-hover: #c73e54;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3436;
      --text-light: #636e72;
      --border: #dfe6e9;
      --blue: #0984e3;
      --yellow: #fdcb6e;
      --green: #00b894;
      --red: #d63031;
      --blue-bg: #ebf5fb;
      --yellow-bg: #fef9e7;
      --green-bg: #e8f8f5;
      --red-bg: #fdedee;
      --rail-line: #b2bec3;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 20px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .mode-toggle label { cursor: pointer; user-select: none; }

    .switch {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.2);
      border-radius: 26px;
      cursor: pointer;
      transition: 0.3s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(22px); }

    .mode-label { opacity: 0.8; }
    .mode-label.active { opacity: 1; font-weight: 600; }

    /* ── Live Mode Config Panel ──────────────────────── */
    .live-config {
      background: var(--primary);
      color: white;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
    }

    .live-config.visible {
      max-height: 300px;
      padding: 1rem 2rem;
    }

    .live-config .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .live-config label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
      display: block;
      margin-bottom: 0.25rem;
    }

    .live-config input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: white;
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }

    .live-config input::placeholder { color: rgba(255,255,255,0.4); }
    .live-config input:focus { outline: none; border-color: var(--accent); }

    .config-full { grid-column: 1 / -1; }

    /* ── Main Container ──────────────────────────────── */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ── Upload Area ─────────────────────────────────── */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: var(--card-bg);
      transition: border-color 0.3s, background 0.3s;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--accent);
      background: #fff5f7;
    }

    .upload-area.has-file {
      border-color: var(--green);
      background: var(--green-bg);
      border-style: solid;
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      opacity: 0.4;
    }

    .upload-area.has-file .upload-icon { opacity: 0.8; }

    .upload-text {
      font-size: 0.95rem;
      color: var(--text-light);
    }

    .upload-text strong { color: var(--text); }

    .file-name {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--green);
      font-weight: 600;
      margin-top: 0.5rem;
    }

    #fileInput { display: none; }

    /* ── Question Input ──────────────────────────────── */
    .question-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .question-input {
      flex: 1;
      padding: 0.85rem 1.1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
      background: var(--card-bg);
    }

    .question-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .run-btn {
      padding: 0 2rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .run-btn:hover { background: var(--accent-hover); }
    .run-btn:active { transform: scale(0.97); }

    .run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Section Headers ─────────────────────────────── */
    .section-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-light);
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }

    /* ── Loop Trace (with progress rail) ─────────────── */
    .loop-trace {
      position: relative;
      padding-left: 2.5rem;
      min-height: 60px;
      margin-bottom: 2rem;
    }

    .loop-trace::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--rail-line);
    }

    .loop-trace:empty::after {
      content: 'Click "Run" to start the agentic loop';
      color: var(--text-light);
      font-style: italic;
      font-size: 0.9rem;
      position: absolute;
      left: 2.5rem;
      top: 0;
    }

    /* ── Step Card ────────────────────────────────────── */
    .step-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      animation: slideIn 0.4s ease-out;
      transition: border-color 0.3s, background 0.3s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-card::before {
      content: '';
      position: absolute;
      left: -2.5rem;
      top: 1.15rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--rail-line);
      background: var(--bg);
      z-index: 1;
      transition: background 0.3s, border-color 0.3s;
    }

    /* Status-based styling */
    .step-card.thinking { border-left: 3px solid var(--blue); background: var(--blue-bg); }
    .step-card.thinking::before { background: var(--blue); border-color: var(--blue); animation: pulse 1.2s ease-in-out infinite; }

    .step-card.waiting { border-left: 3px solid var(--yellow); background: var(--yellow-bg); }
    .step-card.waiting::before { background: var(--yellow); border-color: var(--yellow); animation: pulse 1.2s ease-in-out infinite; }

    .step-card.complete { border-left: 3px solid var(--green); background: var(--green-bg); }
    .step-card.complete::before { background: var(--green); border-color: var(--green); }

    .step-card.error { border-left: 3px solid var(--red); background: var(--red-bg); }
    .step-card.error::before { background: var(--red); border-color: var(--red); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(9, 132, 227, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(9, 132, 227, 0); }
    }

    .step-title {
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .step-status-icon {
      margin-left: auto;
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.8;
    }

    .step-detail {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.4rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* ── Answer Section ──────────────────────────────── */
    .answer-section {
      display: none;
      margin-top: 1.5rem;
    }

    .answer-section.visible { display: block; }

    .answer-box {
      background: var(--card-bg);
      border: 2px solid var(--green);
      border-radius: 12px;
      padding: 1.5rem;
      animation: slideIn 0.5s ease-out;
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .answer-box .page-ref {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      margin-right: 0.25rem;
      font-family: var(--font-mono);
      vertical-align: middle;
    }

    /* ── Error Banner ────────────────────────────────── */
    .error-banner {
      display: none;
      background: var(--red-bg);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      color: var(--red);
      font-size: 0.9rem;
    }

    .error-banner.visible { display: block; animation: slideIn 0.3s ease-out; }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      .question-row { flex-direction: column; }
      .run-btn { padding: 0.85rem; }
      .live-config .config-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────── -->
  <header>
    <h1>Ask Your <span>Document</span></h1>
    <div class="mode-toggle">
      <span class="mode-label active" id="mockLabel">Mock</span>
      <div class="switch">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
      </div>
      <span class="mode-label" id="liveLabel">Live</span>
    </div>
  </header>

  <!-- ── Live Mode Config ────────────────────────────── -->
  <div class="live-config" id="liveConfig">
    <div class="config-grid">
      <div>
        <label for="baseUrl">API Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://app-targetumh-dev.azurewebsites.net">
      </div>
      <div>
        <label for="dealerGuid">Dealer GUID</label>
        <input type="text" id="dealerGuid" value="23f9cad3-175b-4ff9-b0bf-c49c35c7245e">
      </div>
      <div class="config-full">
        <label for="bearerToken">Bearer Token</label>
        <input type="text" id="bearerToken" placeholder="Paste your token from the Champion Portal">
      </div>
    </div>
  </div>

  <!-- ── Main Content ────────────────────────────────── -->
  <div class="container">

    <!-- Upload Area -->
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">&#128196;</div>
      <div class="upload-text">
        <strong>Drop a PDF here</strong> or click to browse<br>
        <small>10 MB max</small>
      </div>
      <div class="file-name" id="fileName"></div>
      <input type="file" id="fileInput" accept=".pdf">
    </div>

    <!-- Question + Run -->
    <div class="question-row">
      <input type="text" class="question-input" id="questionInput"
             placeholder="What are the safety warnings in this manual?"
             value="What are the safety warnings in this manual?">
      <button class="run-btn" id="runBtn" onclick="handleRun()">Run</button>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Loop Trace -->
    <div class="section-header">LOOP TRACE</div>
    <div class="loop-trace" id="loopTrace"></div>

    <!-- Answer -->
    <div class="answer-section" id="answerSection">
      <div class="section-header">ANSWER</div>
      <div class="answer-box" id="answerBox"></div>
    </div>

  </div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════════════

const DEALER_GUID = '23f9cad3-175b-4ff9-b0bf-c49c35c7245e';

function isLiveMode() {
  return document.getElementById('modeToggle').checked;
}

function getBaseUrl() {
  return document.getElementById('baseUrl').value.replace(/\/+$/, '');
}

function getToken() {
  return document.getElementById('bearerToken').value.trim();
}

function getDealerGuid() {
  return document.getElementById('dealerGuid').value.trim() || DEALER_GUID;
}

// ═══════════════════════════════════════════════════════════════
//  MOCK DATA — realistic responses for offline development
// ═══════════════════════════════════════════════════════════════

const MOCK = {
  upload: {
    id: 'a1b2c3d4-5678-9abc-def0-123456789abc',
    name: 'sample-manual.pdf',
    contentType: 'application/pdf',
    size: 2458624,
    ingestionStatus: 'Pending',
    hasEmbedding: false,
    dateAdded: new Date().toISOString()
  },

  // Polling returns these in sequence: Pending → Processing → Completed
  pollSequence: [
    { id: 'a1b2c3d4-5678-9abc-def0-123456789abc', ingestionStatus: 'Processing', hasEmbedding: false },
    { id: 'a1b2c3d4-5678-9abc-def0-123456789abc', ingestionStatus: 'Processing', hasEmbedding: false },
    { id: 'a1b2c3d4-5678-9abc-def0-123456789abc', ingestionStatus: 'Completed', hasEmbedding: true }
  ],

  vectorSearch: {
    jsonrpc: '2.0',
    id: 1,
    result: {
      content: [
        {
          type: 'text',
          text: JSON.stringify({
            results: [
              { mediaFileId: 'a1b2c3d4-5678-9abc-def0-123456789abc', chunkIndex: 2, pageNumber: 12, score: 0.92, preview: 'WARNING: Do not operate this equipment in enclosed or poorly ventilated spaces...' },
              { mediaFileId: 'a1b2c3d4-5678-9abc-def0-123456789abc', chunkIndex: 5, pageNumber: 15, score: 0.87, preview: 'CAUTION: Always wear protective equipment including safety goggles and gloves when...' },
              { mediaFileId: 'a1b2c3d4-5678-9abc-def0-123456789abc', chunkIndex: 8, pageNumber: 22, score: 0.83, preview: 'DANGER: Disconnect the battery and wait 5 minutes before servicing any electrical...' }
            ],
            totalMatches: 3
          })
        }
      ]
    }
  },

  getChunks: {
    jsonrpc: '2.0',
    id: 2,
    result: {
      content: [
        {
          type: 'text',
          text: JSON.stringify({
            chunks: [
              {
                chunkIndex: 2,
                pageNumber: 12,
                text: 'SAFETY WARNING #1 — VENTILATION\n\nDo not operate this equipment in enclosed or poorly ventilated spaces. Carbon monoxide from engine exhaust is odorless and can cause serious injury or death. Ensure adequate airflow of at least 500 CFM when operating indoors. Install carbon monoxide detectors in all enclosed workspaces where this equipment is used.'
              },
              {
                chunkIndex: 5,
                pageNumber: 15,
                text: 'SAFETY WARNING #2 — PROTECTIVE EQUIPMENT\n\nAlways wear protective equipment including safety goggles, heat-resistant gloves, and steel-toed boots when operating or servicing this equipment. Hearing protection is required when noise levels exceed 85 dB. Loose clothing must be secured before approaching moving parts.'
              },
              {
                chunkIndex: 8,
                pageNumber: 22,
                text: 'SAFETY WARNING #3 — ELECTRICAL HAZARD\n\nDisconnect the battery and wait a minimum of 5 minutes before servicing any electrical components. Capacitors may retain charge after power is disconnected. Use an insulated voltage tester to verify zero energy state. Only qualified technicians should perform electrical repairs.'
              }
            ]
          })
        }
      ]
    }
  }
};

let mockPollIndex = 0;

// ═══════════════════════════════════════════════════════════════
//  HELPER FUNCTIONS — These are provided for you. Do NOT modify.
// ═══════════════════════════════════════════════════════════════

/**
 * Upload a PDF file. Returns { id, ingestionStatus, ... }
 */
async function uploadPdf(file) {
  if (!isLiveMode()) {
    await sleep(800);  // simulate network delay
    return { ...MOCK.upload, name: file.name };
  }

  const formData = new FormData();
  formData.append('file', file);
  formData.append('allowUnassigned', 'true');
  formData.append('generateEmbedding', 'true');
  formData.append('description', 'Uploaded for RAG exercise');

  const res = await fetch(`${getBaseUrl()}/api/v1/${getDealerGuid()}/media/upload`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${getToken()}` },
    body: formData
  });

  if (!res.ok) throw new Error(`Upload failed: ${res.status} ${res.statusText}`);
  return await res.json();
}

/**
 * Poll the ingestion status of a media file. Returns { ingestionStatus, ... }
 */
async function getMediaStatus(mediaFileId) {
  if (!isLiveMode()) {
    await sleep(1000);  // simulate polling delay
    const response = MOCK.pollSequence[Math.min(mockPollIndex, MOCK.pollSequence.length - 1)];
    mockPollIndex++;
    return { ...response };
  }

  const res = await fetch(`${getBaseUrl()}/api/v1/${getDealerGuid()}/media/${mediaFileId}`, {
    headers: { 'Authorization': `Bearer ${getToken()}` }
  });

  if (!res.ok) throw new Error(`Status check failed: ${res.status} ${res.statusText}`);
  return await res.json();
}

/**
 * Call an MCP tool via JSON-RPC. Returns the tool result.
 *
 * @param {string} toolName - e.g. "vector_search_media" or "get_document_chunks"
 * @param {object} args     - the arguments object for the tool
 * @returns {object} parsed result from the MCP response
 */
async function callTool(toolName, args) {
  if (!isLiveMode()) {
    await sleep(600);  // simulate network delay
    if (toolName === 'vector_search_media') {
      const response = MOCK.vectorSearch;
      return JSON.parse(response.result.content[0].text);
    }
    if (toolName === 'get_document_chunks') {
      const response = MOCK.getChunks;
      return JSON.parse(response.result.content[0].text);
    }
    throw new Error(`Unknown mock tool: ${toolName}`);
  }

  const body = {
    jsonrpc: '2.0',
    id: Date.now(),
    method: 'tools/call',
    params: {
      name: toolName,
      arguments: { dealerGuid: getDealerGuid(), ...args }
    }
  };

  const res = await fetch(`${getBaseUrl()}/mcp`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) throw new Error(`MCP call failed: ${res.status} ${res.statusText}`);
  const json = await res.json();
  if (json.error) throw new Error(`MCP error: ${json.error.message}`);
  return JSON.parse(json.result.content[0].text);
}

/**
 * Add a new step card to the loop trace.
 *
 * @param {string} id     - unique ID for this step (e.g. "upload", "poll", "search")
 * @param {string} title  - display title (e.g. "Upload + Index")
 * @param {string} detail - detail text shown below the title
 * @param {string} status - one of: "thinking", "waiting", "complete", "error"
 */
function addStep(id, title, detail, status) {
  const trace = document.getElementById('loopTrace');
  const card = document.createElement('div');
  card.className = `step-card ${status}`;
  card.id = `step-${id}`;

  const statusIcons = {
    thinking: '...',
    waiting: '&#8987;',
    complete: '&#10003;',
    error: '&#10007;'
  };

  card.innerHTML = `
    <div class="step-title">
      ${title}
      <span class="step-status-icon">${statusIcons[status] || ''}</span>
    </div>
    <div class="step-detail">${detail}</div>
  `;

  trace.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/**
 * Update an existing step card's detail text and status.
 *
 * @param {string} id     - the step ID used in addStep
 * @param {string} detail - new detail text
 * @param {string} status - new status: "thinking", "waiting", "complete", "error"
 */
function updateStep(id, detail, status) {
  const card = document.getElementById(`step-${id}`);
  if (!card) return;

  card.className = `step-card ${status}`;

  const statusIcons = {
    thinking: '...',
    waiting: '&#8987;',
    complete: '&#10003;',
    error: '&#10007;'
  };

  card.querySelector('.step-status-icon').innerHTML = statusIcons[status] || '';
  card.querySelector('.step-detail').textContent = detail;
}

/**
 * Display the final answer in the answer section.
 *
 * @param {string} html - the answer HTML (can include <span class="page-ref"> tags)
 */
function showAnswer(html) {
  const section = document.getElementById('answerSection');
  const box = document.getElementById('answerBox');
  box.innerHTML = html;
  section.classList.add('visible');
  section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/**
 * Async sleep helper.
 * @param {number} ms - milliseconds to wait
 */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ═══════════════════════════════════════════════════════════════
//  THE AGENTIC LOOP — This is what YOU write!
// ═══════════════════════════════════════════════════════════════

async function runAgenticLoop(file, question) {

  // ── Step 1: Upload the PDF ────────────────────────────────
  // (Done for you — this shows how the helpers work)

  addStep('upload', 'Upload + Index', `Uploading ${file.name}...`, 'thinking');

  const upload = await uploadPdf(file);

  updateStep('upload', `Uploaded! ID: ${upload.id}\ningestionStatus: ${upload.ingestionStatus}`, 'complete');


  // ── Step 2: Poll until embeddings are ready ───────────────
  //
  // TODO: YOUR CODE HERE
  //
  // 1. Call addStep('poll', 'Poll until ready', 'Checking ingestion status...', 'waiting')
  //    to add a "polling" card to the trace.
  //

// ═══════════════════════════════════════════════════════════════
//  UI WIRING — handles clicks, drag-drop, mode toggle
// ═══════════════════════════════════════════════════════════════

let selectedFile = null;

// File selection
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) selectFile(fileInput.files[0]);
});

function selectFile(file) {
  if (file.type !== 'application/pdf') {
    alert('Please select a PDF file.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    alert('File too large. Maximum size is 10 MB.');
    return;
  }
  selectedFile = file;
  uploadArea.classList.add('has-file');
  fileNameEl.textContent = file.name;
}

// In mock mode, create a fake file so users can click Run without choosing a file
function getMockFile() {
  return new File(['mock'], 'sample-manual.pdf', { type: 'application/pdf' });
}

// Mode toggle
const modeToggle = document.getElementById('modeToggle');
const liveConfig = document.getElementById('liveConfig');
const mockLabel = document.getElementById('mockLabel');
const liveLabel = document.getElementById('liveLabel');

modeToggle.addEventListener('change', () => {
  const isLive = modeToggle.checked;
  liveConfig.classList.toggle('visible', isLive);
  mockLabel.classList.toggle('active', !isLive);
  liveLabel.classList.toggle('active', isLive);
});

// Run button
async function handleRun() {
  const question = document.getElementById('questionInput').value.trim();
  if (!question) { alert('Please enter a question.'); return; }

  const file = selectedFile || (!isLiveMode() ? getMockFile() : null);
  if (!file) { alert('Please select a PDF file.'); return; }

  if (isLiveMode() && !getToken()) {
    alert('Please paste your Bearer token in the Live Mode config panel.');
    return;
  }

  // Reset UI
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = 'Running...';
  document.getElementById('loopTrace').innerHTML = '';
  document.getElementById('answerSection').classList.remove('visible');
  document.getElementById('errorBanner').classList.remove('visible');
  mockPollIndex = 0;

  try {
    await runAgenticLoop(file, question);
  } catch (err) {
    const banner = document.getElementById('errorBanner');
    banner.textContent = `Error: ${err.message}`;
    banner.classList.add('visible');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run';
  }
}
</script>
