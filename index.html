<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Your Document — Gateway Chat with Agentic Loop</title>
  <script>
    (async function loadVersionedAssets() {
      let version = 'dev';

      try {
        const res = await fetch('app-version.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.version) version = data.version;
        }
      } catch {
        // Fall back to unversioned local development behavior.
      }

      window.__APP_VERSION__ = version;

      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = `styles.css?v=${version}`;
      document.head.appendChild(css);

      function appendScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `${src}?v=${version}`;
          script.async = false;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      async function loadScripts() {
        try {
          await appendScript('helpers.js');
          await appendScript('loop.js');
        } catch {
          // The page will surface script errors in the browser console.
        }
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', async function onReady() {
          window.removeEventListener('DOMContentLoaded', onReady);
          await loadScripts();
        });
      } else {
        await loadScripts();
      }
    })();
  </script>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────── -->
  <header>
    <h1>Ask Your <span>Document</span></h1>
  </header>

  <!-- ── Config Panel (prefilled from .env) ──────────── -->
  <div class="live-config visible" id="liveConfig">
    <div class="config-hint" id="configHint">
      Copy <code>.env.example</code> to <code>.env</code> and fill in your credentials from the Champion Portal.
    </div>
    <div class="config-hint hidden" id="configStatus">
      Config loaded from <code>.env</code>. The app will use those values automatically.
    </div>
  </div>

  <!-- ── Main Content ────────────────────────────────── -->
  <div class="container">

    <!-- Upload Area -->
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">&#128196;</div>
      <div class="upload-text">
        <strong>Choose a PDF</strong> or drag it here
        <br><span style="font-size:0.8rem">Max 10 MB</span>
      </div>
      <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf">

    <!-- Question + Run -->
    <div class="question-row">
      <input type="text" class="question-input" id="questionInput"
        placeholder="What are the safety warnings in this manual?"
        value="What are the safety warnings in this manual?">
      <button class="run-btn" id="runBtn" onclick="handleRun()">Run</button>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Loop Trace -->
    <div class="section-header">LOOP TRACE</div>
    <div class="loop-trace" id="loopTrace"></div>

    <!-- Answer -->
    <div class="answer-section" id="answerSection">
      <div class="section-header">ANSWER</div>
      <div class="answer-box" id="answerBox"></div>
    </div>

  </div>

  <!--
    ┌─────────────────────────────────────────────────────────┐
    │  FILE GUIDE                                             │
    │                                                         │
    │  .env.example — Copy to .env and fill in credentials    │
    │  styles.css   — UI styling (do not modify)              │
    │  helpers.js   — Auth, API helpers, UI wiring            │
    │                 (do not modify)                          │
    │  loop.js      — YOUR CODE GOES HERE                     │
    │                 Open this file and fill in the TODOs     │
    │  index.html   — This file (page structure)              │
    └─────────────────────────────────────────────────────────┘
  -->

</body>
</html>
